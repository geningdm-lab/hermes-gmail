name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: uv sync --locked --all-extras
      - run: ruff check .
      - run: ruff format --check .
      - run: uv run python -m unittest discover -s tests -t .
